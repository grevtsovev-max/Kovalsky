[newsroom]
database = "data/newsroom.sqlite3"
poll_interval_seconds = 180
retry_items_per_cycle = 2
processing_workers = 2
processing_cycle_seconds = 150
analysis_per_cycle = 25
triage_per_cycle = 12
# Включать после переноса истории и проверки memory_mode=enforce.
story_watch_enabled = false
story_watch_per_cycle = 2
story_watch_items_per_job = 3
weekly_digest_title = "Крипторынок: главное за неделю"
weekly_analysis_enabled = false
weekly_analysis_time = "20:00"
weekly_analysis_lookback_hours = 168
weekly_analysis_max_output_tokens = 2400
digest_title = "Крипторынок: главное за день"
max_post_length = 3500
similarity_threshold = 0.35
freshness_window_hours = 24
# При подключении источника проверять последние 48 часов.
initial_backfill_minutes = 2880
auto_publish_since = "ЗАДАЙТЕ_ДАТУ_СТАРТА_ISO8601"
relevance_terms = ["криптовалют", "криптоактив", "crypto", "digital asset", "биткоин", "bitcoin", "ethereum", "эфириум", "токен", "блокчейн", "blockchain", "web3", "defi", "стейблкоин", "цифровой актив", "цифровая валюта", "цифровой рубль", "цфа", "майнинг", "смарт-контракт", "криптобиржа", "криптообменник", "bitget", "binance", "coinbase", "bybit", "okx", "kraken", "uniswap", "opensea", "metamask", "tether", "circle", "ripple", "solana"]

[ai]
# off / shadow / enforce. Переход на enforce требует переноса опубликованной истории.
memory_mode = "off"
# active / shadow / off. Исследователь выбирает следующий шаг, но публикация
# остаётся за редактором и общим автоматическим допуском.
research_agent_mode = "active"
research_agent_per_cycle = 1
research_agent_max_steps = 3
model = "gpt-6-luna"
api_key_env = "OPENAI_API_KEY"
keychain_service = "KiperNewsroomOpenAI"
max_output_tokens = 1800
timeout_seconds = 45
# Общий сохраняемый бюджет всех ролей; повторы HTTP тоже учитываются.
api_concurrency = 2
api_requests_per_window = 50
api_budget_window_seconds = 180
api_searches_per_window = 3
api_retry_reserve = 4
api_correction_reserve = 2
api_background_per_window = 2
api_account_cooldown_seconds = 900
# Для известных моделей используется официальный тариф, проверенный 2026-10-06,
# с учётом фактического режима обработки из ответа API. Неизвестные расходы
# остаются неизвестными. Для другой модели или договора задайте её тариф:
# [ai.model_prices."имя-модели"]
# input_per_million = <цена USD за миллион входных токенов>
# cached_input_per_million = <цена USD за миллион кешированных токенов>
# output_per_million = <цена USD за миллион выходных токенов>
# ai.search_price_per_call задаётся в [ai], когда используется Web Search.

[billing]
# Отдельный административный ключ OpenAI для чтения Costs API.
# Обычный ключ модели не используется для доступа к расходам.
admin_api_key_env = "OPENAI_ADMIN_KEY"
# admin_api_key_file = "<файл административного ключа вне репозитория>"
# project_ids = ["<идентификатор проекта OpenAI>"]
# true только для проекта, который используется исключительно Kovalsky.
dedicated_project = false

[telegram]
bot_token_env = "TELEGRAM_BOT_TOKEN"
chat_id_env = "TELEGRAM_CHAT_ID"
keychain_service = "KiperNewsroomTelegram"

[[sources]]
name = "Example feed"
type = "rss"
url = "https://example.com/feed.xml"
active = false
priority = 1
reputation = "unknown"
source_role = "aggregator"
[[sources]]
name = "Web Search — крипторынок"
type = "web_search"
url = "https://api.openai.com/v1/responses#crypto-news"
query = "latest official cryptocurrency and digital asset news Russia CIS regulation exchange stablecoin"
active = false
priority = 2
reputation = "unknown"
source_role = "discovery"

[web_search]
# Платный Web Search выключен во всех этапах, пока явно не включён здесь.
enabled = false
min_interval_minutes = 3

[x]
token_env = "X_BEARER_TOKEN"
token_file = "data/x_bearer_token"
min_interval_minutes = 5
timeout_seconds = 20

[[sources]]
name = "X Recent Search — крипторынок"
type = "x"
url = "https://api.x.com/2/tweets/search/recent#crypto-news"
query = "((crypto OR cryptocurrency OR bitcoin OR stablecoin) lang:en) OR ((криптовалют OR криптоактив OR биткоин OR стейблкоин) lang:ru) -is:retweet"
active = false
priority = 2
reputation = "unknown"
source_role = "discovery"

[reader]
# Собственный сервис; включать после проверки чтения и сетевой изоляции.
jina_enabled = false
jina_endpoint = "http://127.0.0.1:3000"
# Облако выключено до настройки отдельного ключа в закрытом серверном файле.
jina_cloud_enabled = false
jina_api_key_env = "JINA_API_KEY"
# jina_api_key_file = "PRIVATE_KEY_FILE"
jina_cloud_daily_requests = 10
jina_cloud_request_tokens = 20000
jina_cloud_proxy = false
# После неудачи обычного извлечения: эти сайты сразу читаются облаком.
jina_cloud_hosts = []
# По умолчанию: папка materials рядом с newsroom.database.
# archive_directory = "data/materials"
