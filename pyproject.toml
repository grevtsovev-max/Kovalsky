[project]
name = "kovalsky-newsroom"
version = "0.1.0"
description = "Local event-driven news monitoring and editorial memory"
requires-python = ">=3.9"
dependencies = ["tomli>=2; python_version < '3.11'", "pymorphy3>=2,<3"]

[project.scripts]
newsroom = "newsroom.cli:main"

[project.optional-dependencies]
telegram-reader = ["telethon>=1.45,<2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["newsroom*"]

[tool.setuptools.package-data]
newsroom = ["*.swift", "integrations/*.gs"]
"newsroom.edition" = ["*.json"]
